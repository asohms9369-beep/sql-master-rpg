var app=document.getElementById('app');var xpEl=document.getElementById('xp');var lvEl=document.getElementById('level');
var state={xp:0,done:{}};try{var raw=localStorage.getItem('sql-single-stable-v1');if(raw)state=JSON.parse(raw);}catch(e){}

function hud(){xpEl.textContent=state.xp;lvEl.textContent=1+Math.floor(state.xp/100);}
function home(){app.innerHTML='<section class="hero"><span class="tag">SINGLE FILE STABLE EDITION</span><h1>理解して、練習して、使えるSQLへ。</h1><p>初級は選択式中心。中級は部分構築。上級から完全記述へ進みます。</p><button class="btn" id="startButton">学習を始める</button></section><section class="card"><h2>学習構成</h2><p>教育 → 例題1問 → 練習4問 → テスト2問 → 中ボス</p></section>';document.getElementById('startButton').onclick=world;}
function world(){var html='<h1>学習ロードマップ</h1>';['初級','中級','上級'].forEach(function(t){html+='<h2>'+t+'編</h2><div class="grid">';UNITS.filter(function(u){return u.tier===t;}).forEach(function(u){html+='<article class="card unit" data-id="'+u.id+'"><span class="tag">UNIT '+u.id+'</span><h3>'+u.title+'</h3><p class="muted">'+u.goal+'</p></article>';});html+='</div>';});app.innerHTML=html;var cards=document.querySelectorAll('.unit');for(var i=0;i<cards.length;i++){cards[i].onclick=function(){openUnit(parseInt(this.getAttribute('data-id'),10));};}}
